server {
    listen 80;

    # O back aceita upload de ate 210MB (spring.servlet.multipart.max-request-size).
    client_max_body_size 210m;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host mantem a porta: sem ela o Spring acha que a requisicao e de outra
        # origem e barra POST/DELETE por CORS.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upload grande: repassa direto em vez de guardar tudo no nginx antes.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Vue Router: qualquer rota que nao e arquivo cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
