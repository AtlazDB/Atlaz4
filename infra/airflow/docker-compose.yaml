# Airflow de PRODUÇÃO na VM (Airflow 3, LocalExecutor, metadados em Postgres).
#
# No PC use o docker-compose.local.yaml (um container só, Oracle local).
#
# Primeira vez, de dentro de ~/Atlaz4/infra/airflow:
#   cp .env.example .env            # e preencha (cada variável diz de onde tirar o valor)
#   mkdir -p logs config            # pastas montadas nos containers, do seu usuário
#   docker compose up -d --build
#
# Abrir a UI: ela NÃO fica exposta na internet (só 127.0.0.1 da VM). Do seu computador:
#   ssh -L 8088:localhost:8088 ubuntu@<IP da VM>      e abra http://localhost:8088
#   usuário admin; a senha é gerada na primeira subida:
#   cat config/simple_auth_manager_passwords.json.generated
#
# Atualizar depois de um git pull:   docker compose up -d --build
# Logs:                              docker compose logs -f airflow-scheduler

x-airflow: &airflow
  build: .
  # Nome próprio: o build nunca sobrescreve a tag oficial apache/airflow (armadilha do README).
  image: atlaz4/airflow:producao
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_SENHA:?defina no .env}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?defina no .env}
    # Os componentes do Airflow 3 conversam com tokens assinados por esta chave: a mesma em todos.
    AIRFLOW__API_AUTH__JWT_SECRET: ${JWT_SECRET:?defina no .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    # Fica em ./config: recriar o container não troca a senha.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json.generated
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "60"
    # As DAGs importam o pacote dags/georural; o Airflow 3 não põe a pasta no caminho sozinho.
    PYTHONPATH: /opt/airflow/dags
    # Na VM da OCI o acesso ao bucket é pela própria VM (dynamic group + policy), sem chave em disco.
    GEORURAL_OCI_AUTH: instance_principal
  user: "${AIRFLOW_UID:-1000}:0"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?defina no .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    mem_limit: 1g

  # Cria e atualiza as tabelas de metadados do Airflow; roda e termina.
  airflow-init:
    <<: *airflow
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      # Só a própria VM enxerga: o acesso é pelo túnel SSH (ver o topo do arquivo).
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 1536m

  # Com o LocalExecutor, as tarefas (coleta e processamento) rodam dentro do scheduler:
  # é ele que precisa de memória (o CAR do PR inteiro usa uns 3 GB no pico).
  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 8g

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 1g

volumes:
  postgres-data:
